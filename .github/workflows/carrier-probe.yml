name: Carrier alerts probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FedEx + UPS service alert pages from a runner
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          probe() {
            local name="$1" url="$2"
            echo "===================== $name ====================="
            echo "URL: $url"
            code=$(curl -sS -o /tmp/p.html -w "%{http_code}" -A "$UA" -L -m 40 \
              -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: en-US,en" "$url")
            echo "HTTP status: $code"
            echo "bytes: $(wc -c < /tmp/p.html 2>/dev/null)"
            echo "--- marker counts ---"
            grep -o -i -E "service.?alert|disruption|no current|no service|__NEXT_DATA__|application/json|/api/|incident|operating normally|delays" /tmp/p.html 2>/dev/null | tr 'A-Z' 'a-z' | sort | uniq -c | sort -rn | head -25
            echo "--- title / first 400 chars ---"
            head -c 400 /tmp/p.html 2>/dev/null; echo
            echo
          }
          probe "FedEx" "https://www.fedex.com/en-us/service-alerts.html"
          probe "UPS" "https://www.ups.com/us/en/service-alerts"
          echo "Probe complete."
