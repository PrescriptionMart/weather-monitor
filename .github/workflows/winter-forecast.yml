name: Build the Winter Pack forecast

# Once an hour: builds data/winter-forecast.json (scripts/build-winter-forecast.py),
# hands it to the Pages deploy through the Actions cache, and starts the deploy.
# GitHub can run schedules hours late, so the page uses a file for up to 12
# hours (with a warning after 6), then loads live from the weather service:
# a late or failed build costs speed and ZIP-by-ZIP detail, never an answer.
on:
  schedule:
    # The NWS national forecast grid for the half hour is out by about :45.
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write    # to start the Pages deploy that publishes the new file

# A build of its own: deploys (the FAA refresh starts one on every change, and
# a newer deploy cancels an older one) never wait for it or cancel it.
concurrency:
  group: winter-forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/winter-forecast-requirements.txt
      - run: pip install -r scripts/winter-forecast-requirements.txt
      # Where each ZIP's residents live (2020 Census), to read its forecast there
      # rather than at its middle. Kept in the Actions cache, never published: the
      # points sit on towns, like the checkpoints. Worked out again (2-3 minutes)
      # only when the script or the ZIP list changes; without them the build
      # reads each ZIP at its geographic centre, as before.
      - name: Pick up where each ZIP's residents live
        id: points
        uses: actions/cache/restore@v4
        with:
          path: data/zip-points.txt
          key: zip-points-${{ hashFiles('scripts/build-zip-points.py', 'data/zip-centroids.txt') }}
      - name: Work them out from the 2020 Census
        if: steps.points.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/build-zip-points.py
      - name: Keep them for the next builds
        if: steps.points.outputs.cache-hit != 'true' && hashFiles('data/zip-points.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: data/zip-points.txt
          key: zip-points-${{ hashFiles('scripts/build-zip-points.py', 'data/zip-centroids.txt') }}
      - name: Build data/winter-forecast.json
        run: python scripts/build-winter-forecast.py --out data/winter-forecast.json
      - name: Hand it to the deploy
        uses: actions/cache/save@v4
        with:
          path: data/winter-forecast.json
          key: winter-forecast-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy the site with it
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
