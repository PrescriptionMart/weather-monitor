name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly, for the Winter Pack forecast (data/winter-forecast.json): the NWS
    # national forecast grid updates around a quarter past each hour.
    - cron: '31 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer deploy supersedes (cancels) an older one.
# This also self-heals the failure mode we hit on 2026-08-06, where a run stuck
# in the environment's "waiting" state held the group for weeks and every
# subsequent deploy queued behind it and was bumped — freezing the live site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Winter Pack forecast is built here, not committed (it changes every
      # hour). The FAA job deploys often, so a build under 50 minutes old is
      # reused from the cache. If the build fails the deploy goes ahead and the
      # page loads live from the weather service, as it always has.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/winter-forecast-requirements.txt
      - name: Restore the last Winter Pack forecast
        uses: actions/cache/restore@v4
        with:
          path: data/winter-forecast.json
          key: winter-forecast-${{ github.run_id }}
          restore-keys: winter-forecast-
      - name: Build the Winter Pack forecast
        continue-on-error: true
        timeout-minutes: 12
        run: |
          pip install -r scripts/winter-forecast-requirements.txt
          python scripts/build-winter-forecast.py --out data/winter-forecast.json --reuse data/winter-forecast.json
      - name: Keep it for the next deploy
        if: hashFiles('data/winter-forecast.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/winter-forecast.json
          key: winter-forecast-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
