name: Refresh FAA delay data

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch FAA airport events
        run: |
          mkdir -p data
          curl -sSf -m 30 \
            -H "User-Agent: Prescription-Mart-Dashboard (ops@prescriptionmart.com)" \
            "https://nasstatus.faa.gov/api/airport-events" \
            -o data/faa-events.json
          # Verify we got valid JSON
          python3 -c "import json; json.load(open('data/faa-events.json'))"
          # Stamp the fetch time into a sidecar file
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/faa-events.timestamp

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/faa-events.json data/faa-events.timestamp
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: refresh FAA delay data"
            git push
          fi
